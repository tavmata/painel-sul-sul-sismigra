<template id="tpl-notas">
  <article class="notas">
    <h2>Notas metodológicas</h2>
    <p><strong>Fonte e unidade de análise.</strong> Microdados do SISMIGRA (Sistema de Registro Nacional Migratório,
      Polícia Federal), divulgados pelo OBMigra/MJSP, de 2010 a abril de 2026. Cada número é uma contagem de
      <em>registros</em> de imigrantes por ano de registro: não é número de pessoas únicas nem fluxo de entrada.
      2026 é parcial (janeiro a abril).</p>
    <p><strong>País de referência.</strong> País de nacionalidade. O arquivo de 2017 não traz nacionalidade; para esse ano
      usa-se o país de nascimento (nos demais anos, os dois coincidem em 97,6% dos registros). Região e sub-região
      seguem a classificação M49 da ONU (o campo CONTINENTE do SISMIGRA é inconsistente e foi descartado).</p>
    <p><strong>Sul Global – critério ONU/DESA (padrão).</strong> Regiões menos desenvolvidas: todos os países, exceto Europa,
      América do Norte (EUA, Canadá, Bermudas, Groenlândia), Austrália, Nova Zelândia e Japão.
      <strong>Critério UNCTAD:</strong> economias em desenvolvimento, excluindo também Israel, Coreia do Sul e Chipre.</p>
    <p><strong>Página Ásia e África.</strong> Mostra todos os países dessas regiões, sem aplicar o critério de Sul Global,
      para comparar a Ásia Oriental (China, Japão, Coreias, Taiwan) com o restante da Ásia e com a África.</p>
    <p><strong>Solicitação de refúgio (DPRNM).</strong> O SISMIGRA rotula como “Não aplicável” os registros com amparo 290
      (art. 2º do Decreto 9.277/2018), o documento provisório do solicitante de refúgio. Aqui eles aparecem como
      “Solicitação de refúgio (DPRNM)” e entram no indicador de acolhida humanitária e refúgio, junto com acolhida
      humanitária, acolhida a venezuelanos e refúgio/asilo.</p>
    <p><strong>Profissões e grupos ocupacionais.</strong> 169 grafias de profissão foram padronizadas em 95 profissões e 14
      grandes grupos, em classificação própria inspirada nos grandes grupos da CBO/ISCO. O indicador
      “% dirigentes e profissionais” tem como base apenas os registros com ocupação declarada no mercado de trabalho
      (exclui estudantes, menores, sem ocupação, aposentados, dependentes e não classificados).</p>
    <p><strong>Filtros.</strong> Os filtros de anos, critério, região e país valem para todas as páginas. Use “Tabela” em cada
      gráfico para ver os números exatos. O endereço da página guarda a aba e os filtros: copie-o para compartilhar
      uma visão específica.</p>
    <p><strong>Código aberto.</strong> Scripts, classificações e o painel Power BI estão em
      <a href="https://github.com/tavmata/painel-sul-sul-sismigra">github.com/tavmata/painel-sul-sul-sismigra</a>
      (código sob licença MIT; conteúdo sob CC BY 4.0). Ao usar, cite o painel e o SISMIGRA.</p>
  </article>
